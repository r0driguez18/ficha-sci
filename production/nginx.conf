# Referência do vhost em produção (Ubuntu + nginx, confirmado 2026-09-14 —
# ver docs/deploy). O servidor real serve a app em HTTPS na porta 8443 com
# certificado autoassinado, a partir de /var/www/sci; ajusta os caminhos de
# certificado e o server_name ao teu ambiente antes de aplicar.

server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/sci-selfsigned.crt;   # ALTERAR: caminho real
    ssl_certificate_key /etc/ssl/private/sci-selfsigned.key; # ALTERAR: caminho real

    root /var/www/sci;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — força HTTPS em pedidos futuros (o browser lembra-se por 1 ano).
    # Confirma primeiro que o acesso é sempre por HTTPS antes de ativar.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP — assume que a API do Supabase responde na MESMA origem (mesmo
    # host:porta do frontend, via proxy/roteamento do próprio nginx ou do
    # Kong). Se a API estiver noutra origem/porta, acrescenta-a a connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # React Router - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
